name: CI/CD Backend Deployment

on:
  push:
    branches:
      - prod  # Cambiar a 'master' si es tu caso

permissions:
  id-token: write # REQUISITO OBLIGATORIO para autenticación OIDC de Azure
  contents: read  # Permite leer el código del repositorio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga del código fuente
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configuración del motor de construcción Docker optimizado
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autenticación Federada en Azure mediante OIDC (Sin llaves secretas)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Autenticación en el Registro de Contenedores de Azure (ACR)
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ vars.AZURE_REGISTRY_NAME }}

      # 5. Construcción y Envío de la Imagen (Inyección del tag SHA para trazabilidad)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io/backend:${{ github.sha }}
            ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Despliegue e Inyección de Configuración en Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          # Instalar o actualizar la extensión de Container Apps en el agente si es necesario
          az extension add --name containerapp --upgrade

          # Paso A: Actualizar/Definir los secretos en el entorno aislado de Azure Container Apps
          az containerapp secret set \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --secrets \
              mongodb-uri="${{ secrets.MONGODB_URI }}" \
              google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              jwt-secret="${{ secrets.JWT_SECRET }}"

          # Paso B: Actualizar la imagen y mapear tanto variables planas como referencias a secretos
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io/backend:${{ github.sha }} \
            --set-env-vars \
              PORT=${{ vars.PORT }} \
              GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} \
              FRONTEND_URL=${{ vars.FRONTEND_URL }} \
              BACKEND_URL=${{ vars.BACKEND_URL }} \
              MONGODB_URI=secretref:mongodb-uri \
              GOOGLE_CLIENT_SECRET=secretref:google-client-secret \
              JWT_SECRET=secretref:jwt-secret

          # Paso C: Forzar y asegurar el Target Port en el Ingress de forma aislada
          az containerapp ingress update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --target-port 3001
